# ============================================================
# ETF OOS Simulation — 사용자 설정
# ============================================================

experiment:
  name: "v3_baseline"          # 실험 태그. 결과 CSV 파일명에 사용됨.

# ============================================================
# ETF / 데이터 기간
# ============================================================
etf:
  code: "SMH"
  start_date: "2017-01-01"
  end_date: null               # null = 오늘까지

base_date: "2026-05-31"        # 이 날까지만 과거 데이터로 취급

# ============================================================
# OOS 기간 분리
# ============================================================
periods:
  optuna_valid_months: 6       # Optuna validation 기간 (월)
  sim_test_months: 11          # Simulation test 기간 (월)

# ============================================================
# 예측 타깃 후보 (Stage 1 Grid Search 전수조사)
# ============================================================
target:
  n_days_candidates: [5, 10, 20]
  return_threshold_candidates: [0.04, 0.05, 0.06, 0.07]  # 0.02/0.03 제거: positive_rate이 너무 높아짐

# ============================================================
# Feature Engineering
# ============================================================
features:
  vif_threshold: 30.0
  feature_select_years: 1      # Train 종료일 기준 최근 N년으로 피처 탐색
  lag_days: [1, 3, 5, 10, 20, 40, 60, 120]
  top_n_max: 40

  # 추가 기술적 지표 활성화 여부
  use_rsi: true
  rsi_period: 14

  use_macd: true
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

  use_bollinger: true
  bollinger_period: 20
  bollinger_std: 2.0

  use_atr: true
  atr_period: 14

  use_52w: true

# ============================================================
# 외부 지표
# ============================================================
external_tickers:
  QQQ:  "QQQ"
  SPY:  "SPY"
  SOXX: "SOXX"
  NVDA: "NVDA"
  TSM:  "TSM"
  VIX:  "^VIX"
  TNX:  "^TNX"
  DXY:  "DXY"
  GOLD: "GC=F"
  OIL:  "CL=F"

external_feature_types:
  QQQ:  "price"
  SPY:  "price"
  SOXX: "price"
  NVDA: "price"
  TSM:  "price"
  VIX:  "risk"
  TNX:  "rate"
  DXY:  "price"
  GOLD: "price"
  OIL:  "price"

# ============================================================
# Importance 계산 (feature selection용 RF)
# ============================================================
importance:
  random_state: 42
  n_rf_runs: 10
  n_repeats: 10

# ============================================================
# Stage 1: n_days + target_return_threshold 전수조사 (Grid Search)
# 탐색 공간이 n_days(3) x threshold(6) = 18가지로 고정되므로
# Optuna 대신 전수조사. n_seeds번 반복해 점수를 안정화.
# ============================================================
stage1:
  objective_metric: "precision_lift_recall"   # precision_lift_recall / precision_lift / f1_lift / return_score
  min_valid_eval_count: 30
  min_valid_pred_1_count: 3
  model_name: "random_forest"
  n_estimators: 300
  top_n_fixed: 20               # Stage 1에서는 top_n 고정 (속도)
  n_seeds: 3                    # 동일 조합을 n_seeds번 반복해 점수 안정화

# ============================================================
# Optuna Stage 2: 모델 + 하이퍼파라미터 탐색
# ============================================================
optuna_stage2:
  n_trials: 200
  objective_metric: "precision_lift_recall"
  min_valid_eval_count: 30
  min_valid_pred_1_count: 3
  model_candidates:            # 탐색할 모델 목록
    - "random_forest"
    - "extra_trees"
    - "gradient_boosting"
    - "hist_gradient_boosting"
    - "xgboost"
    - "lightgbm"
  top_n_range: [5, 40]         # [min, max]
  pred_threshold_range: [0.30, 0.80]
  pred_threshold_step: 0.05

# ============================================================
# 시뮬레이션
# ============================================================
simulation:
  initial_cash: 1_000_000
  buy_ratio: 0.05
  min_cash_ratio: 0.30

# ============================================================
# 캐시
# ============================================================
cache:
  load_from_cache: true         # base_dataset/VIF는 캐시 재사용, stage1/2 pkl 없으면 자동 재실행
